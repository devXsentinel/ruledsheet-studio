<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 640" width="680" height="640" style="background: transparent; font-family: 'Bad Script', 'Caveat', 'Patrick Hand', cursive, sans-serif;">
  <defs>
    <marker id="flow-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000" />
    </marker>
    <filter id="ink-softness" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- TIER 1 -->
  <rect x="30" y="15" width="620" height="175" rx="6" fill="none" stroke="#000000" stroke-width="2" />
  <text x="340" y="38" font-size="14" font-weight="700" fill="#000000" text-anchor="middle">TIER 1: OT / FIELD DEVICE LAYER</text>

  <rect x="55" y="52" width="165" height="40" rx="4" fill="none" stroke="#000000" stroke-width="1.8" />
  <text x="137" y="77" font-size="13" fill="#000000" text-anchor="middle">Temperature Sensor</text>

  <rect x="255" y="52" width="165" height="40" rx="4" fill="none" stroke="#000000" stroke-width="1.8" />
  <text x="337" y="77" font-size="13" fill="#000000" text-anchor="middle">Vibration Sensor</text>

  <rect x="455" y="52" width="165" height="40" rx="4" fill="none" stroke="#000000" stroke-width="1.8" />
  <text x="537" y="77" font-size="13" fill="#000000" text-anchor="middle">Spindle PLC</text>

  <line x1="137" y1="92" x2="137" y2="115" stroke="#000000" stroke-width="1.8" />
  <line x1="337" y1="92" x2="337" y2="115" stroke="#000000" stroke-width="1.8" />
  <line x1="537" y1="92" x2="537" y2="115" stroke="#000000" stroke-width="1.8" />
  <line x1="137" y1="115" x2="537" y2="115" stroke="#000000" stroke-width="1.8" />
  <line x1="340" y1="115" x2="340" y2="135" stroke="#000000" stroke-width="1.8" marker-end="url(#flow-arrow)" />

  <rect x="215" y="137" width="250" height="42" rx="4" fill="none" stroke="#000000" stroke-width="1.8" />
  <text x="340" y="157" font-size="13" font-weight="600" fill="#000000" text-anchor="middle">OPC-UA Server</text>
  <text x="340" y="171" font-size="11" fill="#000000" text-anchor="middle">Address Space (ns=2)</text>

  <!-- Connect Tier 1 to Tier 2 -->
  <line x1="340" y1="190" x2="340" y2="230" stroke="#000000" stroke-width="2" marker-end="url(#flow-arrow)" />
  <text x="348" y="214" font-size="11" font-weight="600" fill="#000000">OPC-UA Poll / Subscription</text>

  <!-- TIER 2 -->
  <rect x="30" y="232" width="620" height="175" rx="6" fill="none" stroke="#000000" stroke-width="2" />
  <text x="340" y="255" font-size="14" font-weight="700" fill="#000000" text-anchor="middle">TIER 2: EDGE GATEWAY LAYER</text>

  <rect x="50" y="270" width="160" height="48" rx="4" fill="none" stroke="#000000" stroke-width="1.8" />
  <text x="130" y="291" font-size="12" font-weight="600" fill="#000000" text-anchor="middle">OPC-UA Client</text>
  <text x="130" y="307" font-size="11" fill="#000000" text-anchor="middle">(Protocol Ingestion)</text>

  <line x1="210" y1="294" x2="245" y2="294" stroke="#000000" stroke-width="1.8" marker-end="url(#flow-arrow)" />

  <rect x="247" y="270" width="180" height="48" rx="4" fill="none" stroke="#000000" stroke-width="1.8" />
  <text x="337" y="291" font-size="12" font-weight="600" fill="#000000" text-anchor="middle">Edge Analytics Engine</text>
  <text x="337" y="307" font-size="11" fill="#000000" text-anchor="middle">(Rolling Avg &amp; Rules)</text>

  <line x1="427" y1="294" x2="465" y2="294" stroke="#000000" stroke-width="1.8" marker-end="url(#flow-arrow)" />

  <rect x="467" y="270" width="160" height="48" rx="4" fill="none" stroke="#000000" stroke-width="1.8" />
  <text x="547" y="291" font-size="12" font-weight="600" fill="#000000" text-anchor="middle">Local Store &amp; Forward</text>
  <text x="547" y="307" font-size="11" fill="#000000" text-anchor="middle">(Buffer DB)</text>

  <line x1="337" y1="318" x2="337" y2="348" stroke="#000000" stroke-width="1.8" marker-end="url(#flow-arrow)" />

  <rect x="215" y="350" width="250" height="42" rx="4" fill="none" stroke="#000000" stroke-width="1.8" />
  <text x="340" y="370" font-size="13" font-weight="600" fill="#000000" text-anchor="middle">MQTT Publisher Client</text>
  <text x="340" y="384" font-size="11" fill="#000000" text-anchor="middle">(JSON Payload + QoS 1)</text>

  <!-- Connect Tier 2 to Tier 3 -->
  <line x1="340" y1="407" x2="340" y2="445" stroke="#000000" stroke-width="2" marker-end="url(#flow-arrow)" />
  <text x="348" y="428" font-size="11" font-weight="600" fill="#000000">TCP/IP (MQTT Publish)</text>

  <!-- TIER 3 -->
  <rect x="30" y="447" width="620" height="175" rx="6" fill="none" stroke="#000000" stroke-width="2" />
  <text x="340" y="470" font-size="14" font-weight="700" fill="#000000" text-anchor="middle">TIER 3: CLOUD / ENTERPRISE LAYER</text>

  <rect x="215" y="482" width="250" height="42" rx="4" fill="none" stroke="#000000" stroke-width="1.8" />
  <text x="340" y="502" font-size="13" font-weight="600" fill="#000000" text-anchor="middle">Cloud MQTT Broker</text>
  <text x="340" y="516" font-size="11" fill="#000000" text-anchor="middle">(Topic Routing &amp; PUBACK)</text>

  <line x1="340" y1="524" x2="340" y2="550" stroke="#000000" stroke-width="1.8" />
  <line x1="180" y1="550" x2="500" y2="550" stroke="#000000" stroke-width="1.8" />
  <line x1="180" y1="550" x2="180" y2="568" stroke="#000000" stroke-width="1.8" marker-end="url(#flow-arrow)" />
  <line x1="500" y1="550" x2="500" y2="568" stroke="#000000" stroke-width="1.8" marker-end="url(#flow-arrow)" />

  <rect x="70" y="570" width="220" height="42" rx="4" fill="none" stroke="#000000" stroke-width="1.8" />
  <text x="180" y="590" font-size="12" font-weight="600" fill="#000000" text-anchor="middle">Time-Series Database</text>
  <text x="180" y="604" font-size="11" fill="#000000" text-anchor="middle">(Telemetry Storage)</text>

  <rect x="390" y="570" width="220" height="42" rx="4" fill="none" stroke="#000000" stroke-width="1.8" />
  <text x="500" y="590" font-size="12" font-weight="600" fill="#000000" text-anchor="middle">SCADA / Alerting Dashboard</text>
  <text x="500" y="604" font-size="11" fill="#000000" text-anchor="middle">(Real-Time KPI &amp; Alerts)</text>
</svg>