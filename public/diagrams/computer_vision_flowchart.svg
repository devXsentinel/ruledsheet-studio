<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 640" width="680" height="640" style="background: transparent; font-family: 'Bad Script', 'Caveat', 'Patrick Hand', cursive, sans-serif;">
  <defs>
    <marker id="flow-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000" />
    </marker>
    <filter id="ink-softness" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Stage 1 -->
  <rect x="140" y="20" width="400" height="50" rx="6" fill="none" stroke="#000000" stroke-width="2" />
  <text x="340" y="42" font-size="14" font-weight="700" fill="#000000" text-anchor="middle">STAGE 1: OPTICAL IMAGE ACQUISITION</text>
  <text x="340" y="58" font-size="12" fill="#000000" text-anchor="middle">Conveyor Sensor ➔ LED Illumination ➔ Industrial Camera</text>

  <line x1="340" y1="70" x2="340" y2="108" stroke="#000000" stroke-width="2" marker-end="url(#flow-arrow)" />
  <text x="350" y="93" font-size="11" fill="#000000">Raw Image I(x, y)</text>

  <!-- Stage 2 -->
  <rect x="140" y="110" width="400" height="50" rx="6" fill="none" stroke="#000000" stroke-width="2" />
  <text x="340" y="132" font-size="14" font-weight="700" fill="#000000" text-anchor="middle">STAGE 2: CLASSICAL IMAGE PROCESSING</text>
  <text x="340" y="148" font-size="12" fill="#000000" text-anchor="middle">Grayscale ➔ Gaussian Denoising ➔ Sobel Gradient Edge Map</text>

  <line x1="340" y1="160" x2="340" y2="198" stroke="#000000" stroke-width="2" marker-end="url(#flow-arrow)" />
  <text x="350" y="183" font-size="11" fill="#000000">Normalized Tensor H × W × 1</text>

  <!-- Stage 3 -->
  <rect x="140" y="200" width="400" height="50" rx="6" fill="none" stroke="#000000" stroke-width="2" />
  <text x="340" y="222" font-size="14" font-weight="700" fill="#000000" text-anchor="middle">STAGE 3: DEEP LEARNING INFERENCE (CNN)</text>
  <text x="340" y="238" font-size="12" fill="#000000" text-anchor="middle">Conv2D (3×3) ➔ ReLU ➔ MaxPool2D ➔ Dense + Sigmoid</text>

  <line x1="340" y1="250" x2="340" y2="295" stroke="#000000" stroke-width="2" marker-end="url(#flow-arrow)" />
  <text x="350" y="278" font-size="11" fill="#000000">Defect Probability P(Defect)</text>

  <!-- Decision -->
  <polygon points="340,298 470,345 340,392 210,345" fill="none" stroke="#000000" stroke-width="2" />
  <text x="340" y="342" font-size="15" font-weight="700" fill="#000000" text-anchor="middle">Is P(Defect) ≥ 0.50?</text>

  <!-- Branch YES (Defective) -->
  <line x1="210" y1="345" x2="140" y2="345" stroke="#000000" stroke-width="2" />
  <line x1="140" y1="345" x2="140" y2="440" stroke="#000000" stroke-width="2" marker-end="url(#flow-arrow)" />
  <text x="175" y="337" font-size="14" font-weight="700" fill="#000000">Yes (Defect)</text>

  <rect x="25" y="442" width="230" height="70" rx="6" fill="none" stroke="#000000" stroke-width="2" />
  <text x="140" y="468" font-size="14" font-weight="700" fill="#000000" text-anchor="middle">VERDICT: REJECT / SCRAP</text>
  <text x="140" y="488" font-size="12" fill="#000000" text-anchor="middle">• Trigger Pneumatic Diverter</text>
  <text x="140" y="504" font-size="12" fill="#000000" text-anchor="middle">• Log Defect &amp; Audit Trail</text>

  <!-- Branch NO (Pass) -->
  <line x1="470" y1="345" x2="540" y2="345" stroke="#000000" stroke-width="2" />
  <line x1="540" y1="345" x2="540" y2="440" stroke="#000000" stroke-width="2" marker-end="url(#flow-arrow)" />
  <text x="495" y="337" font-size="14" font-weight="700" fill="#000000">No (Pass)</text>

  <rect x="430" y="442" width="220" height="70" rx="6" fill="none" stroke="#000000" stroke-width="2" />
  <text x="540" y="468" font-size="14" font-weight="700" fill="#000000" text-anchor="middle">VERDICT: PASS / GOOD</text>
  <text x="540" y="488" font-size="12" fill="#000000" text-anchor="middle">• Continue to Packaging Line</text>
  <text x="540" y="504" font-size="12" fill="#000000" text-anchor="middle">• Increment Real-Time Yield KPI</text>
</svg>