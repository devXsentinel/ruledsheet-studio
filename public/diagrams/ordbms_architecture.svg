<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" width="680" height="420" style="background: transparent; font-family: 'Bad Script', 'Caveat', 'Patrick Hand', cursive, sans-serif;">
  <defs>
    <marker id="flow-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000" />
    </marker>
    <filter id="ink-softness" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- 1. Composite Type Node -->
  <rect x="30" y="20" width="620" height="65" rx="6" fill="none" stroke="#000000" stroke-width="2" />
  <text x="340" y="45" font-size="14" font-weight="700" fill="#000000" text-anchor="middle">USER-DEFINED COMPOSITE TYPE</text>
  <text x="340" y="68" font-size="12.5" fill="#000000" text-anchor="middle">Address_Type : (street VARCHAR, city VARCHAR, zipcode VARCHAR)</text>

  <!-- Arrow down to Parent Table -->
  <line x1="340" y1="85" x2="340" y2="125" stroke="#000000" stroke-width="2" marker-end="url(#flow-arrow)" />

  <!-- 2. Parent Table: Person -->
  <rect x="30" y="127" width="620" height="115" rx="6" fill="none" stroke="#000000" stroke-width="2" />
  <text x="340" y="152" font-size="15" font-weight="700" fill="#000000" text-anchor="middle">PARENT TABLE: Person</text>
  <line x1="40" y1="160" x2="640" y2="160" stroke="#000000" stroke-width="1" stroke-dasharray="2 2" />
  <text x="50" y="186" font-size="13" fill="#000000">• id : INT (Primary Key)</text>
  <text x="50" y="210" font-size="13" fill="#000000">• name : VARCHAR</text>
  <text x="300" y="186" font-size="13" fill="#000000">• address : Address_Type (Composite)</text>
  <text x="300" y="208" font-size="12.5" fill="#000000">• phone_numbers : TEXT[] (Nested Array)</text>
  <text x="315" y="225" font-size="11.5" font-style="italic" fill="#000000">(Multivalued Relation)</text>

  <!-- Arrow down to Child Table with Inheritance Label -->
  <line x1="340" y1="242" x2="340" y2="298" stroke="#000000" stroke-width="2" marker-end="url(#flow-arrow)" />
  <text x="340" y="274" font-size="12" font-weight="600" fill="#000000" text-anchor="middle">(INHERITS / Polymorphic Relation)</text>

  <!-- 3. Child Table: Employee -->
  <rect x="30" y="300" width="620" height="98" rx="6" fill="none" stroke="#000000" stroke-width="2" />
  <text x="340" y="325" font-size="15" font-weight="700" fill="#000000" text-anchor="middle">CHILD TABLE: Employee</text>
  <line x1="40" y1="333" x2="640" y2="333" stroke="#000000" stroke-width="1" stroke-dasharray="2 2" />
  <text x="50" y="358" font-size="12.5" fill="#000000">• [Inherited from Person: id, name, address, phone_numbers]</text>
  <text x="50" y="382" font-size="13" fill="#000000">• emp_id : INT (Primary Key)</text>
  <text x="300" y="382" font-size="13" fill="#000000">• salary : NUMERIC</text>
</svg>