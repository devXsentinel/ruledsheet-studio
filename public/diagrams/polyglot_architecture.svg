<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" width="680" height="380" style="background: transparent; font-family: 'Bad Script', 'Caveat', 'Patrick Hand', cursive, sans-serif;">
  <defs>
    <marker id="flow-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000" />
    </marker>
    <filter id="ink-softness" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- 1. Client & Enterprise Applications -->
  <rect x="60" y="20" width="560" height="42" rx="6" fill="none" stroke="#000000" stroke-width="2" />
  <text x="340" y="46" font-size="14" font-weight="700" fill="#000000" text-anchor="middle">CLIENT &amp; ENTERPRISE APPLICATIONS</text>

  <!-- 4 Downward Arrows -->
  <line x1="120" y1="62" x2="120" y2="105" stroke="#000000" stroke-width="2" marker-end="url(#flow-arrow)" />
  <line x1="265" y1="62" x2="265" y2="105" stroke="#000000" stroke-width="2" marker-end="url(#flow-arrow)" />
  <line x1="415" y1="62" x2="415" y2="105" stroke="#000000" stroke-width="2" marker-end="url(#flow-arrow)" />
  <line x1="560" y1="62" x2="560" y2="105" stroke="#000000" stroke-width="2" marker-end="url(#flow-arrow)" />

  <!-- 2. Specialized Database Engines -->
  <!-- In-Memory DB -->
  <rect x="50" y="108" width="135" height="52" rx="4" fill="none" stroke="#000000" stroke-width="2" />
  <text x="117" y="130" font-size="13" font-weight="600" fill="#000000" text-anchor="middle">In-Memory DB</text>
  <text x="117" y="146" font-size="11" fill="#000000" text-anchor="middle">(RAM Cache)</text>

  <!-- Graph DB -->
  <rect x="200" y="108" width="135" height="52" rx="4" fill="none" stroke="#000000" stroke-width="2" />
  <text x="267" y="130" font-size="13" font-weight="600" fill="#000000" text-anchor="middle">Graph DB</text>
  <text x="267" y="146" font-size="11" fill="#000000" text-anchor="middle">(Nodes / Edges)</text>

  <!-- Blockchain DB -->
  <rect x="350" y="108" width="135" height="52" rx="4" fill="none" stroke="#000000" stroke-width="2" />
  <text x="417" y="130" font-size="13" font-weight="600" fill="#000000" text-anchor="middle">Blockchain DB</text>
  <text x="417" y="146" font-size="11" fill="#000000" text-anchor="middle">(Merkle / Ledger)</text>

  <!-- IoT/Edge DB -->
  <rect x="500" y="108" width="135" height="52" rx="4" fill="none" stroke="#000000" stroke-width="2" />
  <text x="567" y="130" font-size="13" font-weight="600" fill="#000000" text-anchor="middle">IoT / Edge DB</text>
  <text x="567" y="146" font-size="11" fill="#000000" text-anchor="middle">(Time-Series)</text>

  <!-- Bus line connecting all 4 down to Cloud Storage -->
  <line x1="117" y1="160" x2="117" y2="195" stroke="#000000" stroke-width="2" />
  <line x1="267" y1="160" x2="267" y2="195" stroke="#000000" stroke-width="2" />
  <line x1="417" y1="160" x2="417" y2="195" stroke="#000000" stroke-width="2" />
  <line x1="567" y1="160" x2="567" y2="195" stroke="#000000" stroke-width="2" />
  <line x1="117" y1="195" x2="567" y2="195" stroke="#000000" stroke-width="2" />
  <line x1="340" y1="195" x2="340" y2="230" stroke="#000000" stroke-width="2" marker-end="url(#flow-arrow)" />

  <!-- 3. Cloud Distributed Storage Layer -->
  <rect x="40" y="232" width="600" height="120" rx="6" fill="none" stroke="#000000" stroke-width="2" />
  <text x="340" y="258" font-size="14" font-weight="700" fill="#000000" text-anchor="middle">CLOUD DATABASE LAYER (DISTRIBUTED STORAGE)</text>

  <!-- Sub-box: AI Query Optimizer -->
  <rect x="70" y="272" width="540" height="60" rx="4" fill="none" stroke="#000000" stroke-width="1.8" />
  <text x="340" y="295" font-size="13" font-weight="600" fill="#000000" text-anchor="middle">AI-Assisted Query Optimizer Engine</text>
  <text x="340" y="315" font-size="12" fill="#000000" text-anchor="middle">[Learned Cardinality Estimator] ➔ [RL Join Order Selector]</text>
</svg>