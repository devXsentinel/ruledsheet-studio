<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450" width="680" height="450" style="background: transparent; font-family: 'Bad Script', 'Caveat', 'Patrick Hand', cursive, sans-serif;">
  <defs>
    <marker id="flow-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000" />
    </marker>
    <filter id="ink-softness" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Non-Optimized Subgraph -->
  <rect x="20" y="15" width="310" height="420" rx="6" fill="none" stroke="#000000" stroke-width="1.5" stroke-dasharray="4 2" />
  <text x="175" y="42" font-size="15" font-weight="700" fill="#000000" text-anchor="middle">Non-Optimized Canonical Tree</text>

  <rect x="80" y="65" width="190" height="36" rx="4" fill="none" stroke="#000000" stroke-width="1.8" />
  <text x="175" y="88" font-size="14" font-weight="600" fill="#000000" text-anchor="middle">π (Ename, Dname)</text>

  <line x1="175" y1="101" x2="175" y2="135" stroke="#000000" stroke-width="1.8" marker-end="url(#flow-arrow)" />

  <rect x="40" y="137" width="270" height="38" rx="4" fill="none" stroke="#000000" stroke-width="1.8" />
  <text x="175" y="161" font-size="12" font-weight="600" fill="#000000" text-anchor="middle">σ (Dno = Dnumber ∧ Salary &gt; 50000)</text>

  <line x1="175" y1="175" x2="175" y2="215" stroke="#000000" stroke-width="1.8" marker-end="url(#flow-arrow)" />

  <circle cx="175" cy="235" r="20" fill="none" stroke="#000000" stroke-width="2" />
  <text x="175" y="241" font-size="18" font-weight="700" fill="#000000" text-anchor="middle">×</text>
  <text x="175" y="270" font-size="11" fill="#000000" text-anchor="middle">Full Cartesian Product</text>

  <line x1="160" y1="250" x2="105" y2="310" stroke="#000000" stroke-width="1.8" marker-end="url(#flow-arrow)" />
  <line x1="190" y1="250" x2="245" y2="310" stroke="#000000" stroke-width="1.8" marker-end="url(#flow-arrow)" />

  <rect x="45" y="312" width="120" height="36" rx="4" fill="none" stroke="#000000" stroke-width="1.8" />
  <text x="105" y="335" font-size="13" fill="#000000" text-anchor="middle">Table: Employee</text>

  <rect x="185" y="312" width="120" height="36" rx="4" fill="none" stroke="#000000" stroke-width="1.8" />
  <text x="245" y="335" font-size="13" fill="#000000" text-anchor="middle">Table: Dept</text>

  <!-- Optimized Subgraph -->
  <rect x="350" y="15" width="310" height="420" rx="6" fill="none" stroke="#000000" stroke-width="1.5" stroke-dasharray="4 2" />
  <text x="505" y="42" font-size="15" font-weight="700" fill="#000000" text-anchor="middle">Optimized Heuristic Tree</text>

  <rect x="410" y="65" width="190" height="36" rx="4" fill="none" stroke="#000000" stroke-width="1.8" />
  <text x="505" y="88" font-size="14" font-weight="600" fill="#000000" text-anchor="middle">π (Ename, Dname)</text>

  <line x1="505" y1="101" x2="505" y2="145" stroke="#000000" stroke-width="1.8" marker-end="url(#flow-arrow)" />

  <!-- Equijoin Node -->
  <rect x="420" y="147" width="170" height="38" rx="4" fill="none" stroke="#000000" stroke-width="2" />
  <text x="505" y="171" font-size="13" font-weight="700" fill="#000000" text-anchor="middle">⋈ (E.Dno = D.Dnumber)</text>

  <line x1="475" y1="185" x2="435" y2="235" stroke="#000000" stroke-width="1.8" marker-end="url(#flow-arrow)" />
  <line x1="535" y1="185" x2="575" y2="310" stroke="#000000" stroke-width="1.8" marker-end="url(#flow-arrow)" />

  <!-- Selection Pushed Down -->
  <rect x="365" y="237" width="145" height="36" rx="4" fill="none" stroke="#000000" stroke-width="1.8" />
  <text x="437" y="260" font-size="12" font-weight="600" fill="#000000" text-anchor="middle">σ (Salary &gt; 50000)</text>

  <line x1="437" y1="273" x2="437" y2="310" stroke="#000000" stroke-width="1.8" marker-end="url(#flow-arrow)" />

  <rect x="375" y="312" width="125" height="36" rx="4" fill="none" stroke="#000000" stroke-width="1.8" />
  <text x="437" y="335" font-size="13" fill="#000000" text-anchor="middle">Table: Employee</text>

  <rect x="515" y="312" width="120" height="36" rx="4" fill="none" stroke="#000000" stroke-width="1.8" />
  <text x="575" y="335" font-size="13" fill="#000000" text-anchor="middle">Table: Dept</text>
</svg>