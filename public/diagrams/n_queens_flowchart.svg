<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 760" width="680" height="760" style="background: transparent; font-family: 'Bad Script', 'Caveat', 'Patrick Hand', cursive, sans-serif;">
  <defs>
    <marker id="flow-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000" />
    </marker>
    <filter id="ink-softness" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- 1. Start Node -->
  <rect x="270" y="20" width="140" height="38" rx="19" fill="none" stroke="#000000" stroke-width="2" />
  <text x="340" y="44" font-size="16" font-weight="600" fill="#000000" text-anchor="middle">Start</text>

  <!-- Arrow down to Row = 0 -->
  <line x1="340" y1="58" x2="340" y2="92" stroke="#000000" stroke-width="2" marker-end="url(#flow-arrow)" />

  <!-- 2. Row = 0 Node -->
  <rect x="270" y="95" width="140" height="38" rx="4" fill="none" stroke="#000000" stroke-width="2" />
  <text x="340" y="119" font-size="16" fill="#000000" text-anchor="middle">Row = 0</text>

  <!-- Arrow down to Decision: Is Row == N? -->
  <line x1="340" y1="133" x2="340" y2="175" stroke="#000000" stroke-width="2" marker-end="url(#flow-arrow)" />

  <!-- Loopback entry point indicator -->
  <circle cx="340" cy="155" r="3" fill="#000000" />

  <!-- 3. Decision Node: Is Row == N? -->
  <polygon points="340,175 435,215 340,255 245,215" fill="none" stroke="#000000" stroke-width="2" />
  <text x="340" y="220" font-size="15" font-weight="600" fill="#000000" text-anchor="middle">Is Row == N?</text>

  <!-- Branch: YES -> Print Solution -->
  <line x1="245" y1="215" x2="135" y2="215" stroke="#000000" stroke-width="2" />
  <line x1="135" y1="215" x2="135" y2="285" stroke="#000000" stroke-width="2" marker-end="url(#flow-arrow)" />
  <text x="185" y="205" font-size="14" font-weight="700" fill="#000000">Yes</text>

  <rect x="60" y="288" width="150" height="42" rx="4" fill="none" stroke="#000000" stroke-width="2" />
  <text x="135" y="314" font-size="15" font-weight="600" fill="#000000" text-anchor="middle">Print Solution</text>

  <!-- Branch: NO -> Col = 0 -->
  <line x1="435" y1="215" x2="525" y2="215" stroke="#000000" stroke-width="2" />
  <line x1="525" y1="215" x2="525" y2="285" stroke="#000000" stroke-width="2" marker-end="url(#flow-arrow)" />
  <text x="475" y="205" font-size="14" font-weight="700" fill="#000000">No</text>

  <rect x="450" y="288" width="150" height="42" rx="4" fill="none" stroke="#000000" stroke-width="2" />
  <text x="525" y="314" font-size="15" fill="#000000" text-anchor="middle">Col = 0</text>

  <!-- Arrow down to Decision: Is Col < N? -->
  <line x1="525" y1="330" x2="525" y2="370" stroke="#000000" stroke-width="2" marker-end="url(#flow-arrow)" />

  <!-- 4. Decision Node: Is Col < N? -->
  <polygon points="525,372 615,410 525,448 435,410" fill="none" stroke="#000000" stroke-width="2" />
  <text x="525" y="415" font-size="15" font-weight="600" fill="#000000" text-anchor="middle">Is Col &lt; N?</text>

  <!-- Col < N Branch YES -> Is Safe Pos? -->
  <line x1="525" y1="448" x2="525" y2="495" stroke="#000000" stroke-width="2" marker-end="url(#flow-arrow)" />
  <text x="535" y="475" font-size="14" font-weight="700" fill="#000000">Yes</text>

  <!-- Col < N Branch NO -> Backtrack (Row = Row - 1) -->
  <line x1="435" y1="410" x2="310" y2="410" stroke="#000000" stroke-width="2" marker-end="url(#flow-arrow)" />
  <text x="375" y="402" font-size="14" font-weight="700" fill="#000000">No</text>

  <rect x="175" y="390" width="130" height="42" rx="4" fill="none" stroke="#000000" stroke-width="2" />
  <text x="240" y="416" font-size="13" font-weight="600" fill="#000000" text-anchor="middle">Backtrack (Row - 1)</text>

  <!-- Loop from Backtrack back to Is Row == N? -->
  <line x1="175" y1="410" x2="30" y2="410" stroke="#000000" stroke-width="1.8" />
  <line x1="30" y1="410" x2="30" y2="155" stroke="#000000" stroke-width="1.8" />
  <line x1="30" y1="155" x2="335" y2="155" stroke="#000000" stroke-width="1.8" marker-end="url(#flow-arrow)" />

  <!-- 5. Decision Node: Is Safe Pos? -->
  <polygon points="525,498 615,535 525,572 435,535" fill="none" stroke="#000000" stroke-width="2" />
  <text x="525" y="540" font-size="15" font-weight="600" fill="#000000" text-anchor="middle">Is Safe Pos?</text>

  <!-- Safe YES -> Place Queen & Recurse Row + 1 -->
  <line x1="525" y1="572" x2="525" y2="620" stroke="#000000" stroke-width="2" marker-end="url(#flow-arrow)" />
  <text x="535" y="600" font-size="14" font-weight="700" fill="#000000">Yes</text>

  <rect x="420" y="622" width="210" height="44" rx="4" fill="none" stroke="#000000" stroke-width="2" />
  <text x="525" y="642" font-size="13" font-weight="600" fill="#000000" text-anchor="middle">Place Queen at (Row, Col)</text>
  <text x="525" y="658" font-size="12" fill="#000000" text-anchor="middle">Recurse: solve(Row + 1)</text>

  <!-- Recurse loops back to Is Row == N? -->
  <line x1="630" y1="644" x2="660" y2="644" stroke="#000000" stroke-width="1.8" />
  <line x1="660" y1="644" x2="660" y2="155" stroke="#000000" stroke-width="1.8" />
  <line x1="660" y1="155" x2="345" y2="155" stroke="#000000" stroke-width="1.8" marker-end="url(#flow-arrow)" />

  <!-- Safe NO -> Col = Col + 1 -->
  <line x1="435" y1="535" x2="350" y2="535" stroke="#000000" stroke-width="2" />
  <line x1="350" y1="535" x2="350" y2="620" stroke="#000000" stroke-width="2" marker-end="url(#flow-arrow)" />
  <text x="390" y="525" font-size="14" font-weight="700" fill="#000000">No</text>

  <rect x="290" y="622" width="120" height="42" rx="4" fill="none" stroke="#000000" stroke-width="2" />
  <text x="350" y="648" font-size="14" fill="#000000" text-anchor="middle">Col = Col + 1</text>

  <!-- Loop from Col = Col + 1 back to Is Col < N? -->
  <line x1="350" y1="664" x2="350" y2="695" stroke="#000000" stroke-width="1.8" />
  <line x1="350" y1="695" x2="525" y2="695" stroke="#000000" stroke-width="1.8" />
  <line x1="525" y1="695" x2="525" y2="455" stroke="#000000" stroke-width="1.8" />
  <line x1="525" y1="455" x2="525" y2="450" stroke="#000000" stroke-width="1.8" />
</svg>